<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FireBridge — Yangın Risk Panosu / Fire Risk Dashboard — Türkiye</title>
<style>
  :root{
    color-scheme: light;
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --series-1:#2a78d6; --series-2:#eb6834;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --surface-1:#1a1a19; --page:#0d0d0d;
      --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --series-1:#3987e5; --series-2:#d95926;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
       font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  header h1{font-size:21px;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header .sub{color:var(--ink-2);margin:4px 0 0;font-size:13px}
  .badge{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 8px;
         border-radius:6px;border:1.5px solid var(--critical);color:var(--critical)}
  .card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;
        padding:14px 16px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
        gap:10px;margin:16px 0}
  .kpi .lbl{font-size:12px;color:var(--ink-2)}
  .kpi .val{font-size:26px;font-weight:650;margin-top:2px}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .kpi .delta-up{color:var(--critical);font-weight:600}
  .kpi .delta-dn{color:var(--ink-2);font-weight:600}
  .layout{display:grid;grid-template-columns:1fr 280px;gap:10px;align-items:start}
  @media(max-width:880px){.layout{grid-template-columns:1fr}}
  .controls{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:10px}
  .controls .grp{display:flex;gap:4px;flex-wrap:wrap}
  .seg{border:1px solid var(--border);background:transparent;color:var(--ink-2);
       padding:5px 10px;border-radius:8px;font:inherit;font-size:12.5px;cursor:pointer}
  .seg[aria-pressed="true"]{background:var(--ink);color:var(--surface-1);border-color:var(--ink)}
  label.chk{font-size:12.5px;color:var(--ink-2);display:inline-flex;gap:5px;align-items:center;cursor:pointer}
  .dayrow{display:flex;gap:10px;align-items:center;margin:4px 0 10px}
  .dayrow input{flex:1;accent-color:var(--series-1)}
  .dayrow .day{font-weight:650;min-width:84px;text-align:right}
  #mapwrap{position:relative}
  #map{width:100%;display:block;border-radius:8px;cursor:crosshair}
  #tip{position:absolute;pointer-events:none;background:var(--surface-1);color:var(--ink);
       border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;
       box-shadow:0 4px 14px rgba(0,0,0,.18);display:none;max-width:240px;z-index:5}
  #tip b{font-size:12.5px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--ink-2)}
  .legend .it{display:inline-flex;align-items:center;gap:6px}
  .sw{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--border)}
  .detail h3{margin:0 0 6px;font-size:14px}
  .detail .hint{color:var(--muted);font-size:12.5px}
  .detail table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
  .detail td{padding:3px 0;border-bottom:1px solid var(--grid)}
  .detail td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
  .detail td:first-child{color:var(--ink-2)}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
        font-size:12px;font-weight:650;color:#fff}
  .chip.k1{color:#0b0b0b}
  .contrib{margin-top:10px}
  .contrib .row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
  .contrib .nm{width:118px;color:var(--ink-2)}
  .contrib .bar{flex:1;height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
  .contrib .bar i{display:block;height:100%;background:var(--series-1);border-radius:4px}
  .contrib .pv{width:38px;text-align:right;font-variant-numeric:tabular-nums}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  @media(max-width:880px){.row2{grid-template-columns:1fr}}
  h2{font-size:14px;margin:0 0 2px}
  .cardsub{font-size:12px;color:var(--muted);margin:0 0 10px}
  .bars{display:flex;gap:10px;align-items:flex-end;height:170px;padding-top:18px}
  .bars .col{flex:1;display:flex;flex-direction:column-reverse;gap:2px;cursor:pointer;position:relative}
  .bars .col .seg-b{border-radius:3px}
  .bars .col .top{position:absolute;top:-17px;width:100%;text-align:center;font-size:11px;
                  color:var(--ink-2);font-variant-numeric:tabular-nums}
  .bars .col[aria-pressed="true"] .seg-b{outline:2px solid var(--ink);outline-offset:-1px}
  .xlab{display:flex;gap:10px;margin-top:6px}
  .xlab span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
  table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .tbl th{text-align:left;color:var(--ink-2);font-weight:600;padding:5px 6px;
          border-bottom:1px solid var(--baseline);font-size:12px}
  .tbl td{padding:5px 6px;border-bottom:1px solid var(--grid);
          font-variant-numeric:tabular-nums}
  .tbl td:first-child{font-variant-numeric:normal}
  footer{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.6}
  footer b{color:var(--ink-2)}
  #loading{padding:60px;text-align:center;color:var(--muted)}
  #tip{z-index:1000}
  #osm{width:100%;height:540px;border-radius:8px}
  @media(max-width:880px){#osm{height:420px}}
  .leaflet-container{font:inherit}
  .leaflet-tooltip.lbl{background:transparent;border:0;box-shadow:none;padding:0 0 0 2px;
                       font-size:11px;font-weight:600;color:#0b0b0b;text-shadow:0 0 3px #fff,0 0 3px #fff}
  .leaflet-tooltip.lbl:before{display:none}
  .lowzoom .leaflet-tooltip.lbl{display:none}
  .zoomto a{width:auto !important;padding:0 8px;font-size:12px;white-space:nowrap}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <header>
      <h1><span id="t-title">FireBridge — Orman Yangını Risk Panosu</span>
          <span class="badge" id="t-badge">MODEL · 2021 GERİYE DÖNÜK TAHMİN</span></h1>
      <p class="sub" id="t-sub"></p>
    </header>
    <div class="grp" id="langBtns" role="group" aria-label="Language / Dil"></div>
  </div>

  <div id="loading">Yükleniyor… / Loading…</div>

  <div id="app" style="display:none">
    <div class="kpis">
      <div class="card kpi"><div class="lbl" id="t-kpi1">–</div>
        <div class="val" id="kpi1">–</div><div class="sub" id="kpi1s"></div></div>
      <div class="card kpi"><div class="lbl" id="t-kpi2">–</div>
        <div class="val" id="kpi2">–</div><div class="sub" id="kpi2s"></div></div>
      <div class="card kpi"><div class="lbl" id="t-kpi3">–</div>
        <div class="val" id="kpi3">–</div><div class="sub" id="kpi3s"></div></div>
      <div class="card kpi"><div class="lbl" id="t-kpi4">–</div>
        <div class="val" id="kpi4">–</div><div class="sub" id="t-kpi4s"></div></div>
    </div>

    <div class="layout">
      <div class="card">
        <div class="controls">
          <div class="grp" id="layerBtns" role="group"></div>
          <label class="chk"><input type="checkbox" id="ovRoads" checked> <span id="t-roads"></span></label>
          <label class="chk"><input type="checkbox" id="ovSet" checked> <span id="t-set"></span></label>
          <label class="chk"><input type="checkbox" id="ovFires" checked> <span id="t-fires"></span></label>
        </div>
        <div class="dayrow">
          <span style="font-size:12px;color:var(--ink-2)" id="t-day"></span>
          <input type="range" id="day" min="0" max="6" value="5" step="1">
          <span class="day" id="dayLbl"></span>
        </div>
        <div id="mapwrap">
          <div id="osm"></div>
          <canvas id="map" style="display:none"></canvas>
          <div id="tip"></div>
        </div>
        <div class="legend" id="legend"></div>
      </div>

      <div class="card detail" id="detail">
        <h3 id="t-dtitle"></h3>
        <p class="hint" id="t-dhint"></p>
        <div id="detailBody"></div>
      </div>
    </div>

    <div class="row2">
      <div class="card">
        <h2 id="t-btitle"></h2>
        <p class="cardsub" id="t-bsub"></p>
        <div class="bars" id="bars"></div>
        <div class="xlab" id="barsX"></div>
        <div class="legend" id="barsLegend"></div>
      </div>
      <div class="card">
        <h2><span id="t-ttitle"></span> <span id="tblDay"></span></h2>
        <p class="cardsub" id="t-tsub"></p>
        <table class="tbl"><thead><tr>
          <th id="th1"></th><th id="th2"></th><th id="th3"></th><th id="th4"></th>
        </tr></thead><tbody id="tblBody"></tbody></table>
      </div>
    </div>

    <footer>
      <span id="t-f1"></span><br>
      <span id="t-f2"></span><br>
      <span id="t-f3"></span>
    </footer>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
