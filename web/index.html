<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>#BizdenBize — Forest fire risk</title>
  <meta name="description" content="Daily forest fire risk for every 5 km of Türkiye, what to do about it, and a ranked map of reports from the ground.">
  <meta name="theme-color" content="#21293a">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    // apply the saved (or OS) theme before first paint to avoid a flash
    (function () {
      var t; try { t = localStorage.getItem('bb-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="assets/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app"><p style="padding:24px">Loading…</p></div>
  <noscript><p style="padding:24px">This app needs JavaScript. In an emergency call 112.</p></noscript>

  <!-- Report a fire — desktop dialog (Figma O1) / tablet + mobile bottom sheet (Figma O2) -->
  <dialog id="report-dialog" class="sheet" aria-labelledby="report-title">
    <form class="dlg" method="dialog" novalidate>
      <div class="dlg__head">
        <h2 id="report-title" data-i18n="reportDialog.title"></h2>
        <button type="button" class="icon-btn" data-close data-i18n-attr="aria-label:common.close">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <a class="emergency" href="tel:112" data-i18n-html="reportDialog.callFirst"></a>
      <div class="dlg__cols">
        <div class="step">
          <h3><span class="step__n">1</span><span data-i18n="reportDialog.s1"></span></h3>
          <label class="dropzone" for="photo">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
            <span><b data-i18n="reportDialog.dropBig"></b><span class="muted small" data-i18n="reportDialog.dropSmall"></span></span>
          </label>
          <input id="photo" class="visually-hidden" type="file" accept="image/*,video/*" capture="environment">
          <p class="preview" id="photo-preview"></p>
          <h3><span class="step__n">2</span><span data-i18n="reportDialog.s2"></span></h3>
          <div class="toggles" id="what-toggles"></div>
        </div>
        <div class="step">
          <h3><span class="step__n">3</span><span data-i18n="reportDialog.s3"></span></h3>
          <div class="toggles" data-single>
            <button type="button" class="toggle" id="use-gps" aria-pressed="false" data-i18n="reportDialog.useGps"></button>
            <button type="button" class="toggle" id="use-address" aria-pressed="false" data-i18n="reportDialog.typeAddress"></button>
          </div>
          <div class="loc-box" id="loc-box" aria-live="polite"></div>
          <label class="field" hidden id="address"><span data-i18n="reportDialog.addressLabel"></span><input type="text" name="address" autocomplete="street-address"></label>
          <h3><span class="step__n">4</span><span data-i18n="reportDialog.s4"></span> <span class="muted small" data-i18n="reportDialog.s4note"></span></h3>
          <label class="field"><span data-i18n="reportDialog.name"></span><input type="text" name="name" autocomplete="name"></label>
          <label class="field"><span data-i18n="reportDialog.phone"></span><input type="tel" name="phone" autocomplete="tel" inputmode="tel"></label>
          <button type="submit" class="btn btn--coral btn--block" data-i18n="reportDialog.submit"></button>
          <p class="muted small" data-i18n="reportDialog.privacy"></p>
        </div>
      </div>
    </form>
  </dialog>

  <!-- Share sheet (Figma O3) -->
  <dialog id="share-dialog" aria-labelledby="share-title">
    <div class="dlg">
      <div class="dlg__head">
        <h2 id="share-title" data-i18n="shareDialog.title"></h2>
        <button type="button" class="icon-btn" data-close data-i18n-attr="aria-label:common.close">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <p class="muted small" id="share-text"></p>
      <div class="share-list">
        <a class="share-item" id="share-wa" target="_blank" rel="noopener" href="#">WhatsApp</a>
        <a class="share-item" id="share-sms" href="#" data-i18n="shareDialog.sms"></a>
        <button type="button" class="share-item" id="share-copy" data-i18n="shareDialog.copy"></button>
        <button type="button" class="share-item" id="share-native" hidden data-i18n="shareDialog.more"></button>
      </div>
    </div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
